<?xml version="1.0" encoding="UTF-8"?>
<!-- GContactsSync application icon.
     SVG Tiny: plain shapes, explicit attributes, no CSS and no gradients - that is
     what Symbian's .mif converter accepts. A contact inside an open sync ring. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" baseProfile="tiny"
     width="88" height="88" viewBox="0 0 88 88">
  <rect x="0" y="0" width="88" height="88" rx="14" ry="14" fill="#1877F2"/>

  <!-- the sync ring, open at the right -->
  <path d="M 51.26 73.11 A 30.0 30.0 0 1 0 73.54 49.21" fill="none" stroke="#FFFFFF"
        stroke-width="7.0" stroke-linecap="round"/>

  <!-- arrow head, closing the ring in the direction of travel -->
  <path d="M 68.87 60.78 L 80.93 50.51 L 66.16 47.91 Z" fill="#FFFFFF"/>

  <!-- the contact: head and shoulders -->
  <circle cx="44.0" cy="35.0" r="9.5" fill="#FFFFFF"/>
  <path d="M 29.0 62.0 C 29.0 53.0 37.0 48.5 44.0 48.5 C 51.0 48.5 59.0 53.0 59.0 62.0 Z"
        fill="#FFFFFF"/>
</svg>
